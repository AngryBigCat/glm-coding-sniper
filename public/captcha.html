<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>验证码生成器 — GLM Coding Plan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      display: flex; justify-content: center; align-items: flex-start;
      min-height: 100vh; background: #f0f2f5; padding: 20px;
    }
    /* 左右分栏容器 */
    .layout {
      display: flex; gap: 20px; max-width: 1200px; width: 100%;
    }
    .col {
      background: white; border-radius: 12px;
      padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      flex: 1; min-width: 0;
    }
    .col-left { flex: 0 0 420px; order: 2; }
    .col-right { flex: 1; order: 1; }
    h1 { font-size: 18px; margin-bottom: 8px; }
    h2 { font-size: 15px; margin-bottom: 8px; color: #333; }
    .desc { color: #666; font-size: 12px; margin-bottom: 16px; line-height: 1.6; }
    .btn {
      background: #1677ff; color: white; border: none;
      padding: 14px 32px; border-radius: 8px;
      font-size: 16px; cursor: pointer; width: 100%;
    }
    .btn:hover { background: #4096ff; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .btn.success { background: #52c41a; }
    .btn.danger { background: #ff4d4f; }
    .btn-sm {
      background: #f5f5f5; border: 1px solid #d9d9d9;
      padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    .btn-sm:hover { background: #e8e8e8; }
    .btn-sm.primary { background: #1677ff; color: white; border-color: #1677ff; }
    .status-panel {
      margin-top: 20px; padding: 16px; background: #fafafa;
      border: 1px solid #f0f0f0; border-radius: 8px; text-align: left;
    }
    .status-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
    .status-row .label { color: #888; }
    .status-row .value { font-weight: 600; font-family: monospace; }
    .phase-badge {
      display: inline-block; padding: 3px 10px; border-radius: 4px;
      font-size: 12px; font-weight: 600;
    }
    .phase-idle { background: #f0f0f0; color: #666; }
    .phase-collecting { background: #fff7e6; color: #d46b08; }
    .phase-sniping { background: #fff1f0; color: #cf1322; }
    .phase-paused { background: #fff7e6; color: #d46b08; }
    .phase-done { background: #f6ffed; color: #389e0d; }
    .phase-failed { background: #fff2f0; color: #cf1322; }
    .progress-bar {
      margin-top: 12px; height: 8px; background: #f0f0f0;
      border-radius: 4px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, #1677ff, #52c41a);
      transition: width 0.3s;
    }
    .msg { margin-top: 12px; padding: 10px; border-radius: 6px; font-size: 13px; display: none; }
    .msg.ok { background: #f6ffed; border: 1px solid #b7eb8f; color: #389e0d; display: block; }
    .msg.err { background: #fff2f0; border: 1px solid #ffccc7; color: #cf1322; display: block; }
    .msg.info { background: #e6f4ff; border: 1px solid #91caff; color: #0958d9; display: block; }
    .sep { margin: 18px 0; border: 0; border-top: 1px solid #f0f0f0; }
    .actions { margin-top: 12px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .note { margin-top: 14px; font-size: 12px; color: #999; line-height: 1.6; }
    .server-status { margin-top: 8px; font-size: 12px; }
    .server-ok { color: #52c41a; }
    .server-err { color: #cf1322; }

    /* ===== 监控面板 ===== */
    .monitor-panel {
      margin-top: 16px; padding: 14px; background: #fafafa;
      border: 1px solid #f0f0f0; border-radius: 8px; text-align: left;
    }
    .monitor-title {
      font-size: 13px; font-weight: 600; color: #333;
      margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
    }
    .monitor-title .badge { font-size: 11px; color: #888; font-weight: 400; }

    /* 库存灯 */
    .stock-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    .stock-item {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 8px; background: white; border-radius: 6px;
      font-size: 12px; border: 1px solid #f0f0f0;
    }
    .stock-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .dot-green { background: #52c41a; box-shadow: 0 0 6px #52c41a80; }
    .dot-yellow { background: #faad14; }
    .dot-red { background: #ff4d4f; }
    .dot-unknown { background: #d9d9d9; }
    .stock-name { color: #555; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 日志流 */
    .log-stream {
      max-height: 180px; overflow-y: auto; background: #1e1e1e;
      border-radius: 6px; padding: 8px; font-family: 'Consolas', monospace;
    }
    .log-stream::-webkit-scrollbar { width: 6px; }
    .log-stream::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
    .log-line {
      font-size: 11px; color: #d4d4d4; padding: 2px 0;
      line-height: 1.5; word-break: break-all;
    }
    .log-time { color: #6a9955; margin-right: 6px; }
    .log-line.ok { color: #4ec9b0; }
    .log-line.err { color: #f48771; }

    /* 下单结果卡片 */
    .order-card {
      padding: 12px; border-radius: 8px; font-size: 13px;
    }
    .order-success { background: #f6ffed; border: 1px solid #b7eb8f; color: #389e0d; }
    .order-fail { background: #fff2f0; border: 1px solid #ffccc7; color: #cf1322; }
    .order-card .order-title { font-weight: 600; margin-bottom: 4px; }
    .order-card a { color: #1677ff; word-break: break-all; }
    .order-empty { color: #999; font-size: 12px; text-align: center; padding: 12px; }

    /* 统计 */
    .stat-row { display: flex; gap: 16px; }
    .stat-item { flex: 1; text-align: center; padding: 8px; background: white; border-radius: 6px; border: 1px solid #f0f0f0; }
    .stat-value { font-size: 18px; font-weight: 700; color: #1677ff; font-family: monospace; }
    .stat-label { font-size: 11px; color: #888; margin-top: 2px; }
  </style>
</head>
<body>
<div class="layout">
  <!-- ===== 左栏：验码 ===== -->
  <div class="col col-left">
    <h1>🔐 验证码生成器</h1>
    <p class="desc">
      拖完滑块自动推送。选「自动循环」模式，只需拖滑块。
    </p>

    <div id="serverStatus" class="server-status"></div>

    <!-- 主操作按钮 -->
    <div style="margin-top: 14px;">
      <button class="btn" id="autoBtn" onclick="toggleAuto()">⚡ 自动循环出码</button>
    </div>

    <div class="actions">
      <button class="btn-sm" onclick="manualOne()">手动出一个</button>
      <button class="btn-sm" onclick="stopAuto()">⏹ 停止</button>
    </div>

    <!-- 验码状态 -->
    <div class="status-panel" id="statusPanel">
      <div class="status-row">
        <span class="label">抢购阶段</span>
        <span><span class="phase-badge phase-idle" id="phaseBadge">等待启动</span></span>
      </div>
      <div class="status-row">
        <span class="label">池中 ticket</span>
        <span class="value" id="poolSize">0</span>
      </div>
      <div class="status-row">
        <span class="label">已生产 / 已消费</span>
        <span class="value"><span id="totalProduced">0</span> / <span id="totalConsumed">0</span></span>
      </div>
      <div class="status-row">
        <span class="label">本页本次出码</span>
        <span class="value" id="localProduced">0</span>
      </div>
      <div class="msg info" id="msgBox">连接抢购脚本中...</div>
    </div>

    <hr class="sep">

    <!-- 最近出码记录 -->
    <div style="text-align:left;">
      <div style="font-size:13px; font-weight:600; color:#333; margin-bottom:6px;">最近 5 个 ticket</div>
      <div id="recentList" style="font-size:11px; color:#888; font-family:monospace; max-height:80px; overflow:auto;">
        （尚无）
      </div>
    </div>

    <p class="note">
      每个 ticket 有效期约 3-5 分钟。<br>
      滑块完成会自动 POST 到 <code>/push</code>。
    </p>
  </div>

  <!-- ===== 右栏：抢购监控 ===== -->
  <div class="col col-right">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h2 style="margin:0;">📊 抢购监控</h2>
      <button class="btn-sm" id="pauseBtn" onclick="togglePause()">⏸ 暂停抢购</button>
    </div>

    <!-- 库存监控 -->
    <div class="monitor-panel">
      <div class="monitor-title">
        <span>📦 库存监控</span>
        <span class="badge" id="stockUpdateTime">未查询</span>
      </div>
      <div class="stock-grid" id="stockGrid">
        <div class="stock-item"><span class="stock-dot dot-unknown"></span><span class="stock-name">等待数据...</span></div>
      </div>
    </div>

    <!-- 下单结果 -->
    <div class="monitor-panel">
      <div class="monitor-title"><span>🎯 最近下单</span></div>
      <div id="orderCard"><div class="order-empty">尚未尝试下单</div></div>
    </div>

    <!-- 统计 -->
    <div class="monitor-panel">
      <div class="stat-row">
        <div class="stat-item">
          <div class="stat-value" id="statCheckCount">0</div>
          <div class="stat-label">库存查询次数</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="statUptime">0s</div>
          <div class="stat-label">运行时长</div>
        </div>
      </div>
    </div>

    <!-- 日志流 -->
    <div class="monitor-panel">
      <div class="monitor-title"><span>📜 抢购日志</span><span class="badge">最近 30 条</span></div>
      <div class="log-stream" id="logStream">
        <div class="log-line" style="color:#666;">等待日志...</div>
      </div>
    </div>
  </div>
</div>

<script>
// ===== 配置 =====
const CAPTCHA_APP_ID = '196026326';
const AUTO_INTERVAL_MS = 2000;   // 自动循环：每个滑块完成后等 2 秒再弹下一个

// ===== 状态 =====
let autoMode = false;
let captchaBusy = false;
let localProduced = 0;
let recent = [];   // 最近 5 个 ticket 摘要
let serverReachable = false;

// ===== 工具 =====
function setMsg(text, type = 'info') {
  const el = document.getElementById('msgBox');
  el.textContent = text;
  el.className = 'msg ' + type;
}

function addRecent(ticket) {
  recent.unshift(ticket.slice(0, 24) + '...');
  if (recent.length > 5) recent.pop();
  document.getElementById('recentList').innerHTML = recent.map(t => `<div>${t}</div>`).join('');
}

// ===== 推送 ticket 到抢购脚本 =====
async function pushTicket(ticket, randstr) {
  try {
    const r = await fetch('/push', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ticket, randstr }),
    });
    const data = await r.json();
    serverReachable = true;
    document.getElementById('serverStatus').innerHTML = '<span class="server-ok">✅ 已连接抢购脚本</span>';
    return data;
  } catch (e) {
    serverReachable = false;
    document.getElementById('serverStatus').innerHTML = `<span class="server-err">❌ 抢购脚本未启动</span>`;
    setMsg(`推送失败：抢购脚本未启动？请先运行 npm start`, 'err');
    return null;
  }
}

// ===== 弹一个滑块 =====
function showOneCaptcha(onDone) {
  if (captchaBusy) return;
  captchaBusy = true;
  new TencentCaptcha(CAPTCHA_APP_ID, function(res) {
    captchaBusy = false;
    if (res.ret === 0) {
      localProduced++;
      document.getElementById('localProduced').textContent = localProduced;
      addRecent(res.ticket);
      // 自动推送到抢购脚本
      pushTicket(res.ticket, res.randstr).then(() => {
        if (typeof onDone === 'function') onDone(true);
      });
    } else {
      setMsg(`滑块未完成（ret=${res.ret}）`, 'err');
      if (typeof onDone === 'function') onDone(false);
    }
  }, { mode: 'bind', type: 'popup', enableDarkMode: false, timeout: 60000 }).show();
}

// ===== 自动循环出码 =====
function autoLoop() {
  if (!autoMode) return;
  // 抢购已完成，停止
  if (lastPhase === 'done') {
    setMsg('🎉 抢购成功！已停止出码', 'ok');
    autoMode = false;
    updateAutoBtn();
    return;
  }
  if (lastPhase === 'failed') {
    setMsg('❌ 抢购失败/停止，已停止出码', 'err');
    autoMode = false;
    updateAutoBtn();
    return;
  }
  if (captchaBusy) { setTimeout(autoLoop, 500); return; }

  showOneCaptcha(() => {
    if (autoMode) setTimeout(autoLoop, AUTO_INTERVAL_MS);
  });
}

function toggleAuto() {
  if (autoMode) { stopAuto(); return; }
  if (!window.TencentCaptcha) { setMsg('验证码 SDK 还在加载中，稍等...', 'err'); return; }
  autoMode = true;
  updateAutoBtn();
  setMsg('🚀 自动循环出码已启动，请拖滑块', 'info');
  autoLoop();
}

function stopAuto() {
  autoMode = false;
  updateAutoBtn();
  setMsg('已停止自动循环', 'info');
}

// ===== 暂停/继续抢购 =====
async function togglePause() {
  const btn = document.getElementById('pauseBtn');
  const isPausedNow = btn.textContent.includes('继续');
  try {
    const endpoint = isPausedNow ? '/resume' : '/pause';
    await fetch(endpoint, { method: 'POST' });
    // 按钮状态由 pollStatus 自动更新
  } catch (e) {
    setMsg('暂停/继续失败：抢购脚本未启动', 'err');
  }
}

function manualOne() {
  if (!window.TencentCaptcha) { setMsg('验证码 SDK 还在加载中', 'err'); return; }
  showOneCaptcha();
}

function updateAutoBtn() {
  const btn = document.getElementById('autoBtn');
  if (autoMode) {
    btn.textContent = '⏸ 自动循环中（点击停止）';
    btn.className = 'btn danger';
  } else {
    btn.textContent = '⚡ 自动循环出码';
    btn.className = 'btn';
  }
}

// ===== 轮询抢购状态 =====
let lastPhase = 'idle';
async function pollStatus() {
  try {
    const r = await fetch('/status');
    const d = await r.json();
    serverReachable = true;
    document.getElementById('serverStatus').innerHTML = '<span class="server-ok">✅ 已连接抢购脚本</span>';

    lastPhase = d.phase;
    document.getElementById('poolSize').textContent = d.poolSize;
    document.getElementById('totalProduced').textContent = d.totalProduced;
    document.getElementById('totalConsumed').textContent = d.totalConsumed;

    const badge = document.getElementById('phaseBadge');
    const phaseText = {
      idle: '等待启动',
      collecting: '收集 ticket',
      sniping: '抢购中',
      paused: '已暂停',
      done: '抢购成功 🎉',
      failed: '抢购失败',
    }[d.phase] || d.phase;
    badge.textContent = phaseText + (d.message ? ' · ' + d.message : '');
    badge.className = 'phase-badge phase-' + d.phase;

    // 更新暂停按钮状态
    const pauseBtn = document.getElementById('pauseBtn');
    if (d.phase === 'paused') {
      pauseBtn.textContent = '▶️ 继续抢购';
      pauseBtn.className = 'btn-sm primary';
    } else if (d.phase === 'sniping') {
      pauseBtn.textContent = '⏸ 暂停抢购';
      pauseBtn.className = 'btn-sm';
    } else {
      // done/failed/idle/collecting 时禁用暂停按钮
      pauseBtn.disabled = (d.phase === 'done' || d.phase === 'failed' || d.phase === 'idle');
    }

    // 自动模式下，若抢购结束则停止出码
    if (autoMode && (d.phase === 'done' || d.phase === 'failed')) {
      stopAuto();
    }

    // ===== 渲染监控面板 =====
    renderStock(d.lastStock || []);
    renderOrder(d.lastOrder);
    renderStats(d.checkCount || 0, d.startedAt);
    renderLogs(d.logs || []);
  } catch (e) {
    serverReachable = false;
    document.getElementById('serverStatus').innerHTML = '<span class="server-err">❌ 抢购脚本未启动</span>';
  }
}

// ===== 库存监控灯 =====
function renderStock(items) {
  const grid = document.getElementById('stockGrid');
  if (!items || items.length === 0) {
    grid.innerHTML = '<div class="stock-item"><span class="stock-dot dot-unknown"></span><span class="stock-name">等待数据...</span></div>';
    document.getElementById('stockUpdateTime').textContent = '未查询';
    return;
  }
  const dotClass = { green: 'dot-green', yellow: 'dot-yellow', red: 'dot-red', unknown: 'dot-unknown' };
  grid.innerHTML = items.map(it =>
    `<div class="stock-item"><span class="stock-dot ${dotClass[it.status] || 'dot-unknown'}"></span><span class="stock-name">${it.name}</span></div>`
  ).join('');
  document.getElementById('stockUpdateTime').textContent = `第 ${document.getElementById('statCheckCount').textContent} 次查询`;
}

// ===== 下单结果卡片 =====
function renderOrder(order) {
  const el = document.getElementById('orderCard');
  if (!order) {
    el.innerHTML = '<div class="order-empty">尚未尝试下单</div>';
    return;
  }
  const time = new Date(order.ts).toLocaleTimeString('zh-CN', { hour12: false });
  if (order.ok) {
    const sign = order.sign ? `<div style="margin-top:6px;"><a href="${order.sign}" target="_blank">${order.sign}</a></div>` : '';
    el.innerHTML = `<div class="order-card order-success">
      <div class="order-title">✅ 下单成功 · ${order.productName} · ¥${order.payAmount}</div>
      <div style="font-size:11px;opacity:0.7;">${time}</div>${sign}
    </div>`;
  } else {
    el.innerHTML = `<div class="order-card order-fail">
      <div class="order-title">❌ 下单失败</div>
      <div style="font-size:12px;">${order.error || '未知错误'}</div>
      <div style="font-size:11px;opacity:0.7;margin-top:4px;">${time}</div>
    </div>`;
  }
}

// ===== 统计 =====
function renderStats(checkCount, startedAt) {
  document.getElementById('statCheckCount').textContent = checkCount;
  if (startedAt) {
    const secs = Math.floor((Date.now() - startedAt) / 1000);
    const str = secs >= 60 ? `${Math.floor(secs / 60)}m${secs % 60}s` : `${secs}s`;
    document.getElementById('statUptime').textContent = str;
  }
}

// ===== 日志流 =====
function renderLogs(logs) {
  const el = document.getElementById('logStream');
  if (!logs || logs.length === 0) {
    el.innerHTML = '<div class="log-line" style="color:#666;">等待日志...</div>';
    return;
  }
  // 最新的在顶部
  const html = [...logs].reverse().map(entry => {
    const time = new Date(entry.ts).toLocaleTimeString('zh-CN', { hour12: false });
    let cls = 'log-line';
    if (entry.text.includes('✅') || entry.text.includes('🏆')) cls += ' ok';
    else if (entry.text.includes('❌') || entry.text.includes('🔴') || entry.text.includes('⚠️')) cls += ' err';
    return `<div class="${cls}"><span class="log-time">${time}</span>${escapeHtml(entry.text)}</div>`;
  }).join('');
  el.innerHTML = html;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ===== 初始化：加载 SDK =====
function loadSDK() {
  return new Promise((resolve, reject) => {
    if (window.TencentCaptcha) { resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://turing.captcha.qcloud.com/TJCaptcha.js';
    s.onload = resolve;
    s.onerror = () => reject(new Error('SDK 加载失败'));
    document.head.appendChild(s);
  });
}

loadSDK()
  .then(() => {
    setMsg('✅ 验证码 SDK 已就绪。点「自动循环出码」开始', 'ok');
    pollStatus();
    setInterval(pollStatus, 500);
  })
  .catch(() => setMsg('❌ 验证码 SDK 加载失败，请检查网络后刷新', 'err'));
</script>
</body>
</html>
